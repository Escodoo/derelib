name: Bug report
description: Report incorrect XML, validation or parsing
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: derelib version
    validations:
      required: true
  - type: textarea
    id: xml
    attributes:
      label: Anonymized XML sample
      render: xml
